name: chenqianyu486-sys/dsh-zju-lecture-note
category: docs
description:
  en: 'Turns Zhejiang University classroom replays (classroom.zju.edu.cn) into Markdown study notes. Its scraping core comes from nzw806/zju-lecture-summerizer- (a standalone Python tool, not a DSH plugin), and the slide capture follows 8eoyw/zju-learning-cli (MIT), reimplemented here without copying code. It reads the public speech transcript by minute, sentence or chunk, can download projected slide screenshots as a PDF, and writes a note named after the class date and section whose Markdown is checked so formulas and tables render. A reading PDF is typeset locally with Typst; when Typst is missing the plugin installs the official release itself (about 20 MB, SHA256-pinned, opt-out) instead of failing, and it ships a redistributable OFL CJK font subset plus the Typst packages it uses, so PDFs work offline too. The reading template is its own; its layout and the optional fill-in-notes PDF use the MIT-licensed scholia Typst template by Eric Yang (typst.app/universe/package/scholia), whose packages are vendored together with their licence files. An unofficial tool, not affiliated with or endorsed by Zhejiang University or the upstream author. Transcript reading is public; slide capture is opt-in and needs a ZJU login state (ZJU_COOKIE / ZJU_COOKIE_FILE or a local Edge profile).'
  zh: '把浙大智云课堂（classroom.zju.edu.cn）回放整理成 Markdown 复习讲义。抓取内核来自 nzw806/zju-lecture-summerizer-（独立 Python 工具，不是 DSH 插件）；投影截图参考 8eoyw/zju-learning-cli（MIT）的思路重新实现，未拷贝其代码。读取公开语音字幕（按分钟 / 逐句 / 分块），可下载课堂投影截图并合成 PDF、按需把关键页引用进讲义；讲义按上课日期与本节内容命名写入，并检查 Markdown 使公式与表格正常渲染。讲义 PDF 由本机 Typst 排版：缺少 Typst 时插件会自行下载官方版本安装（约 20 MB，SHA256 固定，可关闭），并随包提供可再分发的中文 OFL 字体子集与所用 Typst 包，离线也能出 PDF。阅读版模板由本项目自研；其版式与可选的填空笔记使用 Eric Yang 的 scholia Typst 模板（MIT，typst.app/universe/package/scholia），相关包已连同许可文件一并随包分发。本项目为非官方工具，与浙江大学及上游作者均无隶属关系、未获背书。字幕读取公开免登录；投影截图需在插件设置中开启，并需要浙大登录态（ZJU_COOKIE / ZJU_COOKIE_FILE 或本机 Edge）。'
