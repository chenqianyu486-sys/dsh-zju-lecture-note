name: chenqianyu486-sys/dsh-zju-lecture-note
category: docs
description:
  en: 'Turns Zhejiang University classroom replays (classroom.zju.edu.cn) into Markdown study notes and a same-name reading PDF typeset locally with Typst. The scraping core comes from nzw806/zju-lecture-summerizer- (a standalone Python tool, not a DSH plugin); slide capture follows 8eoyw/zju-learning-cli (MIT), reimplemented without copying code. The optional fill-in study notes are typeset with Eric Yang''s MIT-licensed scholia template (typst.app/universe/package/scholia); their color and paragraph specs are this project''s own (see the scholia-notes spec). The reading PDF uses a self-contained template visually informed by scholia''s light theme, without copying upstream source. Transcripts are read by minute, sentence or chunk. PDFs work out of the box: a missing Typst is installed from the official release (SHA256-pinned, opt-out), and the scholia packages plus redistributable OFL CJK font subsets ship with the plugin, so it also works offline. Unofficial tool, not affiliated with or endorsed by Zhejiang University or the upstream author. Transcript reading is public; slide capture is opt-in (enable it in the plugin settings) and needs a ZJU login state (ZJU_COOKIE / ZJU_COOKIE_FILE or a local Edge profile).'
  zh: '把浙大智云课堂（classroom.zju.edu.cn）回放整理成 Markdown 复习讲义，并用 Typst 在本地排成同名 PDF。抓取内核来自 nzw806/zju-lecture-summerizer-（独立 Python 工具，不是 DSH 插件）；投影截图参考 8eoyw/zju-learning-cli（MIT）重新实现，未拷贝代码。可选填空笔记是**基于 Typst scholia 模板排版**的填空式学习笔记（MIT，Eric Yang，typst.app/universe/package/scholia）；配色与段落规范由本项目定义，见 scholia-notes 规范。阅读版 PDF 由本项目自包含模板排版（视觉参考 scholia 浅色主题，未拷贝源码）。字幕按分钟 / 逐句 / 分块读取；缺少 Typst 时插件自动下载官方版本（SHA256 固定、可关闭），scholia 等 Typst 包与可再分发的中文 OFL 字体子集随包分发，离线也能出 PDF。本项目为非官方工具，与浙江大学及上游作者均无隶属关系、未获背书。字幕读取公开免登录；投影截图需在插件设置中开启（opt-in），并需要浙大登录态（ZJU_COOKIE / ZJU_COOKIE_FILE 或本机 Edge）。'
