name: chenqianyu486-sys/dsh-zju-lecture-note
category: docs
description:
  en: 'Turns Zhejiang University classroom replays (classroom.zju.edu.cn) into Markdown study notes. Its scraping core comes from nzw806/zju-lecture-summerizer- (a standalone Python tool, not a DSH plugin), and the slide capture follows 8eoyw/zju-learning-cli (MIT), reimplemented here without copying code. It reads the public speech transcript by minute, sentence or chunk, can download the projected slide screenshots as a PDF and reference selected pages in the note, and writes a note named after the class date and section whose Markdown is checked so formulas and tables render. It also renders the note to a PDF locally with Typst; the reading template is its own, while its layout and the optional fill-in-notes PDF are based on the MIT-licensed scholia Typst template by Eric Yang (typst.app/universe/package/scholia). No upstream code is copied, and the project is not affiliated with or endorsed by the upstream author. Transcript reading is public; the slide capture is opt-in (enable it in the plugin settings) and needs a ZJU login state (ZJU_COOKIE / ZJU_COOKIE_FILE or a local Edge profile).'
  zh: '把浙大智云课堂（classroom.zju.edu.cn）回放整理成 Markdown 复习讲义。抓取内核来自 nzw806/zju-lecture-summerizer-（独立 Python 工具，不是 DSH 插件）；投影截图参考 8eoyw/zju-learning-cli（MIT）的思路重新实现，未拷贝其代码。读取公开语音字幕（按分钟 / 逐句 / 分块），可下载课堂投影截图并合成 PDF、按需把关键页引用进讲义；讲义按上课日期与本节内容命名写入，并检查 Markdown 使公式与表格正常渲染。还会用 Typst 在本地把讲义排成同名 PDF；阅读版模板由本项目自研，其版式与可选的填空笔记则基于 Eric Yang 的 scholia Typst 模板（MIT，typst.app/universe/package/scholia）；本项目未拷贝上游代码，与上游作者无隶属关系、未获背书。字幕读取公开免登录；投影截图需在插件设置中开启，并需要浙大登录态（ZJU_COOKIE / ZJU_COOKIE_FILE 或本机 Edge）。'
